<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Auth App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-center">
    <main class="container px-3">
        <div class="card app-card mx-auto">
            <div class="card-header text-center py-3">Internship Auth Project</div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-4 mb-md-5">Register → Login → Profile</p>
                <div class="row g-2">
                    <div class="col-6">
                        <a href="register.html" class="btn btn-primary w-100">Register</a>
                    </div>
                    <div class="col-6">
                        <a href="login.html" class="btn btn-outline-primary w-100">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        if (localStorage.getItem('sessionToken')) {
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
