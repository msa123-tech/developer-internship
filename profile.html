<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card app-card">
        <div class="card-header text-center py-3">User Profile</div>
        <div class="card-body p-4">
            <div id="profileView" class="profile-box">
                <p><strong>Email:</strong> <span id="viewEmail"></span></p>
                <p><strong>Name:</strong> <span id="viewName"></span></p>
                <p><strong>Phone:</strong> <span id="viewPhone"></span></p>
                <p><strong>Age:</strong> <span id="viewAge"></span></p>
                <p><strong>Date of Birth:</strong> <span id="viewDob"></span></p>
                <p><strong>Address:</strong> <span id="viewAddress"></span></p>
            </div>

            <hr>

            <h5 class="mb-3">Update Profile</h5>
            <form id="profileForm">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone">
                </div>
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" id="age" name="age" min="1" max="120">
                </div>
                <div class="mb-3">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="dob" name="dob">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address <span class="text-muted">(optional)</span></label>
                    <input type="text" class="form-control" id="address" name="address">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>

            <div id="profileAlert" class="alert alert-box mt-3" role="alert"></div>

            <button id="logoutBtn" class="btn btn-outline-danger w-100 mt-3">Logout</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
